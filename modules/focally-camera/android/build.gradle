plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.focallycamera'
version = '0.0.1'

def cameraArchitectures = (findProperty('reactNativeArchitectures') ?: 'armeabi-v7a,arm64-v8a,x86,x86_64').split(',')

android {
  namespace "expo.modules.focallycamera"
  ndkVersion rootProject.ext.ndkVersion
  externalNativeBuild {
    cmake { path 'CMakeLists.txt'; version '3.22.1' }
  }
  lint { abortOnError true }
  defaultConfig {
    minSdkVersion 29
    versionCode 1
    versionName project.version.toString()
    buildConfigField "String", "VERSION_NAME", "\"${project.version}\""
    externalNativeBuild {
      cmake {
        targets 'focally-jpeg'
        abiFilters (*cameraArchitectures)
      }
    }
  }
}

dependencies {
  implementation 'com.facebook.react:react-android'
  implementation 'androidx.concurrent:concurrent-futures:1.1.0'
  def cameraVersion = '1.6.2'
  implementation "androidx.camera:camera-core:$cameraVersion"
  implementation "androidx.camera:camera-camera2:$cameraVersion"
  implementation "androidx.camera:camera-lifecycle:$cameraVersion"
  implementation "androidx.camera:camera-view:$cameraVersion"
  implementation 'androidx.exifinterface:exifinterface:1.4.2'
  testImplementation 'junit:junit:4.13.2'
}
